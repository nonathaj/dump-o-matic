[workspace]
resolver = "2"
members = [
    "crates/dumo-core",
    "crates/dumo-drives",
    "crates/dumo-backends",
    "crates/dumo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nonathaj/dump-o-matic"
authors = ["nonathaj"]
rust-version = "1.75"

[workspace.dependencies]
dumo-core = { path = "crates/dumo-core" }
dumo-drives = { path = "crates/dumo-drives" }
dumo-backends = { path = "crates/dumo-backends" }

# NOTE: versions are pinned to the last releases supporting rust 1.75 (see rust-version
# above). Newer releases of clap and friends require edition2024. Once the toolchain is
# updated past 1.85, these upper bounds can be relaxed.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.4.18", features = ["derive"] }
libc = "0.2"
sha1 = "0.10"
base64 = "0.21"
toml = "0.8"
sha2 = "0.10"
